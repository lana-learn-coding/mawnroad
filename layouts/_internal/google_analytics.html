{{ if not (eq .Params.thumbnail.src nil) }}
    <meta property="og:image" content="{{ absURL .Params.thumbnail.src }}">
{{ end }}

{{ $prod := false }}
{{ with .Params.tags }}
    {{ range . }}
        {{ if eq . "Real" }}
            <script src="https://sdk.moneyoyo.com/v1/webpush.js?pid=yn8aBIF9ytmj92XFyOxZOd1wBopu5wtTcml5tZRrj_8"
                    async></script>
            {{ $prod = true }}
            {{ break }}}
        {{ end }}
    {{ end }}
{{ end }}

{{ if not $prod }}
    <script src="https://sdk-dev.moneyoyo.org/v1/webpush.js?pid=66GwjROBg5L1W69Zt4m2FHLkaCs_mzD2YNr75XZW-CQ" async></script>
{{ end }}

<script>
if (location.href.includes('mnyy_debug=1')) {
    const script = document.createElement('script');
    script.src = '/eruda.js';
    script.defer = true;
    script.onload = () => {
        if (window.eruda) {
            window.eruda.init();
        }
    }
    document.head.append(script);
}
</script>
